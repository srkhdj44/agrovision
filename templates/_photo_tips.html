<div class="photo-tips">
    <h3 class="tips-title">Tips for a clear photo</h3>
    <ul class="tips-list">
        <li>Photograph <strong>one leaf</strong>, close up, filling most of the picture.</li>
        <li>Use a <strong>plain background</strong>, such as a sheet of paper or your palm.</li>
        <li>Take the photo in <strong>daylight</strong>, without strong shadows.</li>
        <li>Make sure the leaf is <strong>in focus</strong>, not blurry.</li>
    </ul>
</div>
