<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgroVision{% endblock %} | AgroVision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('home') }}" class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M20 3C10 3 4 9 4 17c0 1.4.2 2.7.6 4l1.9-.6C6.2 19.3 6 18.2 6 17c0-2 .5-3.8 1.4-5.4C9 14 11.6 15.5 15 16c4-1 5-6 5-13z"/>
            </svg>
            AgroVision
        </a>
        <nav>
            <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
            <a href="{{ url_for('about') }}" class="{{ 'active' if request.endpoint == 'about' }}">About</a>
            <a href="{{ url_for('how_it_works') }}" class="{{ 'active' if request.endpoint == 'how_it_works' }}">How It Works</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 AgroVision . Final Year Project, KICT, IIUM</p>    
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
