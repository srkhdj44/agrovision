<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgroVision checks a crop leaf photo for signs of disease and suggests what to do next.">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <title>{% block title %}AgroVision{% endblock %} | AgroVision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('home') }}" class="logo">
            AgroVision
        </a>
        <nav>
            <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
            <a href="{{ url_for('about') }}" class="{{ 'active' if request.endpoint == 'about' }}">About</a>
            <a href="{{ url_for('how_it_works') }}" class="{{ 'active' if request.endpoint == 'how_it_works' }}">How It Works</a>
            <a href="{{ url_for('upload') }}" class="nav-cta {{ 'active' if request.endpoint == 'upload' }}">Upload</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 AgroVision &middot; Final Year Project KICT, IIUM</p>    
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
